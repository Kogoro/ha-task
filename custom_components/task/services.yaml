complete_task:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: task
    completed_at:
      required: false
      selector:
        datetime:

postpone_task:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: task
    days:
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 365
          mode: box
          unit_of_measurement: days

undo_completion:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: task

get_history:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: task
    limit:
      required: false
      default: 50
      selector:
        number:
          min: 1
          max: 500
          mode: box

set_away:
  fields:
    person:
      required: true
      selector:
        entity:
          domain: person
    start:
      required: false
      selector:
        date:
    end:
      required: false
      selector:
        date:

clear_away:
  fields:
    person:
      required: true
      selector:
        entity:
          domain: person

export_config:
  fields:
    include_history:
      required: false
      default: false
      selector:
        boolean:
    filename:
      required: false
      example: task_export.json
      selector:
        text:

import_config:
  fields:
    data:
      required: false
      selector:
        object:
    filename:
      required: false
      example: task_export.json
      selector:
        text:
    dry_run:
      required: false
      default: false
      selector:
        boolean:

reset_task:
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: task
