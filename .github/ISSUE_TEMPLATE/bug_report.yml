name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.4"
    validations:
      required: true
  - type: input
    id: task_version
    attributes:
      label: Task version
      description: Shown on the integration page and in HACS.
      placeholder: "0.3.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from Settings → System → Logs (search for `task`).
      render: text
  - type: textarea
    id: config
    attributes:
      label: Card or automation YAML
      description: Only if the problem is about a card or an automation.
      render: yaml
