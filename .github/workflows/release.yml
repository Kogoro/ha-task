name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create zip for release
        run: |
          cd custom_components/task
          zip -r ../../task.zip .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: task.zip
